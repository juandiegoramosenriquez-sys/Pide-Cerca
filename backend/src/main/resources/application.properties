spring.application.name=backend
spring.config.import=optional:file:./secrets.properties,optional:file:./backend/secrets.properties

server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pidecerca}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jackson.time-zone=America/Lima

pidecerca.jwt.secret=${JWT_SECRET:PideCercaClaveSecretaParaJWT2026Segura123456789}
pidecerca.jwt.expiracion-ms=86400000
pidecerca.cors.origenes=http://localhost:*,http://127.0.0.1:*
pidecerca.admin.correo=${ADMIN_CORREO:admin@pidecerca.com}
pidecerca.admin.password=${ADMIN_PASSWORD:admin123}
pidecerca.demo.habilitado=${DEMO:true}
